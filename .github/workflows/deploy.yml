# Déploiement de csle.fr sur le VPS LSAN (prod seule), sur le modèle de LSAN.
# push main → contrôles → migrations (tunnel SSH, rôle csle_owner) → build → rsync → bascule → sonde.
#
# Seul le job « migrate » touche la base. Le build n'en a pas besoin (site rendu à la
# requête) et le service tourne avec csle_app, sans aucun droit sur le schéma.
#
# Environnement GitHub « prod » :
#   secrets : SSH_KEY (clé privée de csle-deploy), SSH_KNOWN_HOSTS, SSH_HOST,
#             DATABASE_URL_OWNER (csle_owner, via le TUNNEL : 127.0.0.1:55432, jamais 5432)
#   variables : SITE_URL (https://csle.fr), MEDIA_PUBLIC_BASE_URL (https://images.csle.fr)
name: Déploiement

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: '24'
  RELEASES: /srv/csle/front/releases
  PORT: '3020'
  PG_TUNNEL_PORT: '55432'

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm exec tsc --noEmit
      # Tests sans base : convertisseurs de migration
      - run: pnpm exec vitest run scripts

  migrate:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: prod
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Vérifie le secret du propriétaire
        env:
          DATABASE_URL_OWNER: ${{ secrets.DATABASE_URL_OWNER }}
        run: |
          case "$DATABASE_URL_OWNER" in
            *"@127.0.0.1:${PG_TUNNEL_PORT}/"*) ;;
            *) echo "::error title=DATABASE_URL_OWNER::absent ou ne visant pas le tunnel (127.0.0.1:${PG_TUNNEL_PORT})"; exit 1 ;;
          esac

      - uses: ./.github/actions/ssh-setup
        with:
          key: ${{ secrets.SSH_KEY }}
          known_hosts: ${{ secrets.SSH_KNOWN_HOSTS }}
          host: ${{ secrets.SSH_HOST }}

      - uses: ./.github/actions/pg-tunnel
        with:
          port: ${{ env.PG_TUNNEL_PORT }}

      - name: Migrations Payload
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_OWNER }}
          PAYLOAD_SECRET: migrate-only-not-a-secret
        run: pnpm payload migrate

      - name: Ferme le tunnel
        if: always()
        run: pkill -f "\-L ${PG_TUNNEL_PORT}:127\.0\.0\.1:5432" || true

  deploy:
    needs: [check, migrate]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: prod
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Vérifie la configuration
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          MEDIA_PUBLIC_BASE_URL: ${{ vars.MEDIA_PUBLIC_BASE_URL }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          missing=""
          for v in SITE_URL MEDIA_PUBLIC_BASE_URL SSH_KEY SSH_KNOWN_HOSTS SSH_HOST; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          [ -z "$missing" ] || { echo "::error title=Configuration incomplète::manquant :$missing"; exit 1; }

      - run: pnpm install --frozen-lockfile

      - name: Restaure le cache Next
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .next/cache
          key: next-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: next-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Build
        env:
          # Figées dans le bundle : URL publique du site et domaine des images
          NEXT_PUBLIC_SERVER_URL: ${{ vars.SITE_URL }}
          MEDIA_PUBLIC_BASE_URL: ${{ vars.MEDIA_PUBLIC_BASE_URL }}
          # Le build ne se connecte pas à la base : valeurs factices volontaires
          DATABASE_URL: postgresql://build:unused@127.0.0.1:1/none
          PAYLOAD_SECRET: build-only-not-a-secret
          NEXT_TELEMETRY_DISABLED: '1'
        run: pnpm build

      - name: Assemble l'artefact
        run: |
          set -euo pipefail
          out=.next/standalone
          [ -f "$out/server.js" ] || { echo "standalone absent" >&2; exit 1; }
          cp -r .next/static "$out/.next/static"
          # public/ sans les médias (servis par R2)
          rsync -a --exclude media/ public/ "$out/public/"
          # Jamais de .env dans l'artefact
          find "$out" -maxdepth 1 -name '.env*' -print -delete
          echo "artefact : $(du -sh "$out" | cut -f1)"

      - uses: ./.github/actions/ssh-setup
        with:
          key: ${{ secrets.SSH_KEY }}
          known_hosts: ${{ secrets.SSH_KNOWN_HOSTS }}
          host: ${{ secrets.SSH_HOST }}

      - name: Pousse la release
        run: |
          set -euo pipefail
          ssh vps "mkdir -p $RELEASES/$GITHUB_SHA"
          rsync -az --delete .next/standalone/ "vps:$RELEASES/$GITHUB_SHA/"

      - name: Bascule et vérifie
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          set -euo pipefail
          ssh vps "/srv/csle/deploy.sh $GITHUB_SHA"
          host=$(printf '%s' "$SITE_URL" | sed -E 's#^https?://##; s#/.*##')
          for _ in $(seq 1 45); do
            code=$(ssh vps "curl -s -o /dev/null -w '%{http_code}' --max-time 5 -H 'Host: $host' http://127.0.0.1:$PORT/" || true)
            case "$code" in 2*|3*) echo "csle.fr OK (HTTP $code)"; exit 0 ;; esac
            sleep 2
          done
          echo "::error title=Sonde en échec::le service ne répond pas (dernier code : $code). Rollback : ssh vps /srv/csle/deploy.sh <sha-précédent>"
          exit 1
